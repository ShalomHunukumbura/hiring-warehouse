[project]
name = "hiring-warehouse"
version = "0.1.0"
description = "A dbt warehouse over the job postings Unlisted collects"
readme = "README.md"
authors = [
    { name = "Shalom Hunukumbura", email = "shalom@xaventra.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
hiring-warehouse = "hiring_warehouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
