name: hiring_warehouse
version: "0.1.0"
config-version: 2
profile: hiring_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Folder of daily extracts. Tests point this at small made-up extracts instead.
  extracts: data/extracts

models:
  hiring_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table

seeds:
  hiring_warehouse:
    skills:
      +column_types:
        skill: varchar
        category: varchar
        pattern: varchar
        case_sensitive: boolean
    job_families:
      +column_types:
        family: varchar
        priority: integer
        pattern: varchar
